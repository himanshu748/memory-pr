[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mempr"
version = "0.1.0"
description = "Pull requests for agent memory: review every change to a shared Markdown graph as graph facts, with Relate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["relate-db>=1.2,<2", "PyYAML>=6", "mcp>=1.12,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mempr = "mempr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mempr = ["*.yaml", "SKILL.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
