name: memory-review
# Reviews every pull request as a change to the memory graph, comments the result, and
# fails when the change would damage the graph. Make the `memory-review` check required
# on the base branch and a bad memory change cannot be merged.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
permissions:
  contents: read
  pull-requests: write
  statuses: write
concurrency:
  group: memory-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true
jobs:
  memory-review:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install mempr from the base branch
        run: |
          base=$(gh pr view "$PR" --json baseRefName -q .baseRefName)
          head=$(gh pr view "$PR" --json headRefOid -q .headRefOid)
          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "HEAD=$head" >> "$GITHUB_ENV"
          git fetch -q origin "$base" "$head"
          git worktree add -q "$RUNNER_TEMP/tool" "origin/$base"
          if [ -f "$RUNNER_TEMP/tool/pyproject.toml" ]; then
            pip install -q "$RUNNER_TEMP/tool"
          else
            pip install -q .  # the base branch has no mempr yet
          fi
      - name: Review the memory change
        id: review
        run: |
          set +e
          mempr check --base "origin/$BASE" --head "$HEAD" \
            --out "$RUNNER_TEMP/comment.md" --json "$RUNNER_TEMP/review.json"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          if [ -f "$RUNNER_TEMP/comment.md" ]; then
            cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'Memory review could not run. See the review step log for details.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Comment on the pull request
        # A fork's token cannot comment; the result is still in the job summary.
        continue-on-error: true
        run: |
          [ -f "$RUNNER_TEMP/comment.md" ] || exit 0
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            -q '.[] | select(.body | startswith("<!-- mempr-review -->")) | .id' | tail -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" \
              -F body=@"$RUNNER_TEMP/comment.md" -q .html_url
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
              -F body=@"$RUNNER_TEMP/comment.md" -q .html_url
          fi
      - name: Report the result as a commit status
        # GitHub holds this workflow for approval on a pull request the Actions token opened,
        # and a run started by hand is not counted as that pull request's check, so the
        # result is also set as the `memory-review` status. Every run sets it, so a later
        # run always replaces an earlier result. A fork's token cannot set it.
        continue-on-error: true
        env:
          CODE: ${{ steps.review.outputs.code }}
        run: |
          case "$CODE" in
            0) state=success; text="Memory review passed" ;;
            1) state=failure; text="Memory review found problems" ;;
            *) state=failure; text="Memory review could not run" ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f state="$state" \
            -f context=memory-review -f description="$text" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -q .state
      - name: Block the merge when the review found problems
        env:
          CODE: ${{ steps.review.outputs.code }}
        run: exit "$CODE"
