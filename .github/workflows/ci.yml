name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript tests, with no npm install
        run: node --test tests/js/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install the wheel outside the source checkout
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" .
          python -m venv "$RUNNER_TEMP/wheel-venv"
          mempr_bin="$RUNNER_TEMP/wheel-venv/bin"
          "$mempr_bin/python" -m pip install "$RUNNER_TEMP"/wheels/mempr-*.whl
          "$mempr_bin/python" -m pip check
          mkdir "$RUNNER_TEMP/wheel-demo"
          cp -R memory "$RUNNER_TEMP/wheel-demo/memory"
          cd "$RUNNER_TEMP/wheel-demo"
          git init -q -b main
          git add memory
          git -c user.name='Wheel smoke' -c user.email=wheel@example.invalid commit -qm 'Seed vault'
          "$mempr_bin/mempr" --version
          "$mempr_bin/mempr" recall payments-api > recall.txt
          grep -q 'postgres-15' recall.txt
          "$mempr_bin/mempr" check --base main --head main --out review.md
          grep -q 'Memory review: passed' review.md
          "$mempr_bin/mempr" setup --agent claude
          test -s .claude/skills/memory-pr/SKILL.md
  action:
    # Runs the bundled action as another repository would, so a broken action.yml fails here.
    # It reviews main against itself: the result does not depend on the pull request.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          base: origin/main
          head: origin/main
          comment: "false"
  consumer-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - name: Prepare a separate consumer repository
        run: |
          cp -R source/memory memory
          git init -q -b main
          git config user.email 'consumer-example@example.invalid'
          git config user.name 'Memory PR consumer example'
          git add memory
          git commit -qm 'Seed consumer vault'
          git switch -qc derived-change
          cat > memory/Entity/backup-policy.md <<'EOF'
          ---
          type: Entity
          name: backup-policy
          ---
          EOF
          cat > memory/Fact/backup-policy--database--mysql-8.md <<'EOF'
          ---
          type: Fact
          name: backup-policy--database--mysql-8
          predicate: database
          value: mysql-8
          status: active
          preserve_value: true
          ABOUT:
            - "[[Entity/backup-policy]]"
          ASSERTED_BY:
            - "[[Agent/scout]]"
          SOURCE:
            - "[[Source/demo-project-services-payments-api-service-yaml]]"
          DERIVED_FROM:
            - "[[Fact/payments-api--restore-drill--quarterly-pg-restore]]"
          ---
          EOF
          git add memory
          git commit -qm 'Propose a contradictory derived value'
      - uses: himanshu748/memory-pr@5c881355da5e595464ae5c15f61d56db783259fb
        with:
          base: main
          head: main
          comment: "false"
      - uses: himanshu748/memory-pr@5c881355da5e595464ae5c15f61d56db783259fb
        id: derived-review
        continue-on-error: true
        with:
          base: main
          head: derived-change
          comment: "false"
      - name: Confirm the published Action rejected the three-hop contradiction
        env:
          REVIEW_OUTCOME: ${{ steps.derived-review.outcome }}
        run: |
          test "$REVIEW_OUTCOME" = failure
          grep -q 'multi-hop-contradiction' "$RUNNER_TEMP/mempr-comment.md"
          grep -q '3 step(s)' "$RUNNER_TEMP/mempr-comment.md"
