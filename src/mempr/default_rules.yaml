# Each rule is a Cypher query over the merged memory graph. A row is a finding.
# The check reports only findings the pull request introduces (absent on the base branch).
#
# Graph model (folders are labels, notes are nodes, wikilink lists are relationships):
#   (:Fact {predicate, value, status})-[:ABOUT]->(:Entity)
#   (:Fact)-[:ASSERTED_BY]->(:Agent)      (:Fact)-[:SOURCE]->(:Source)
#   (:Fact)-[:SUPERSEDES]->(:Fact)        (:Fact)-[:DERIVED_FROM]->(:Fact)
#   (:Predicate {cardinality: one|many})  optional; a predicate holds one value unless it says many

- id: contradiction
  severity: block
  title: Contradicts a fact already in memory
  message: >-
    `{entity}` has two active values for `{predicate}`: `{value}` (Fact/{fact}) and
    `{other_value}` (Fact/{other}). Path:
    (Fact/{fact})-[:ABOUT]->(Entity/{entity})<-[:ABOUT]-(Fact/{other})
  fix: >-
    If the new value replaces the old one, add `SUPERSEDES: - "[[Fact/<old>]]"` to the new
    fact. If the old one is right, drop the new fact.
  cypher: |
    MATCH (a:Fact)-[:ABOUT]->(e:Entity)<-[:ABOUT]-(b:Fact)
    WHERE a.name < b.name
      AND a.status = 'active' AND b.status = 'active'
      AND a.predicate = b.predicate AND a.value <> b.value
      AND NOT EXISTS { MATCH (n:Fact)-[:SUPERSEDES]->(a) WHERE n.status = 'active' }
      AND NOT EXISTS { MATCH (n:Fact)-[:SUPERSEDES]->(b) WHERE n.status = 'active' }
      AND NOT EXISTS { MATCH (p:Predicate {name: a.predicate}) WHERE p.cardinality = 'many' }
    RETURN a.name AS fact, b.name AS other, e.name AS entity,
           a.predicate AS predicate, a.value AS value, b.value AS other_value
    ORDER BY fact, other

- id: supersedes-cycle
  severity: block
  title: Facts replace each other in a circle
  message: >-
    Fact/{fact} replaces itself through {hops} `SUPERSEDES` link(s), so none of the facts
    in the circle counts as current. Path: {path}
  fix: >-
    Remove the `SUPERSEDES` link that points at the fact that should be current.
  cypher: |
    MATCH p = (f:Fact)-[:SUPERSEDES*1..6]->(f)
    RETURN f.name AS fact, length(p) AS hops,
           reduce(s = '', n IN nodes(p) |
                  s + CASE WHEN s = '' THEN '' ELSE ' -[:SUPERSEDES]-> ' END + 'Fact/' + n.name) AS path

- id: stale-derivation
  severity: block
  title: Rests on a fact that was retracted or replaced
  message: >-
    Fact/{fact} is current but is derived, {hops} step(s) away, from Fact/{root}, which is
    {reason}. Path: {path}
  fix: >-
    Re-check the derived fact against the current value, then retract it, replace it with
    a new fact that supersedes it, or point `DERIVED_FROM` at the fact that replaced the
    old one.
  cypher: |
    MATCH p = (f:Fact)-[:DERIVED_FROM*1..6]->(root:Fact)
    WHERE f.status = 'active'
      AND NOT EXISTS { MATCH (n:Fact)-[:SUPERSEDES]->(f) WHERE n.status = 'active' }
      AND (root.status = 'retracted'
           OR EXISTS { MATCH (n:Fact)-[:SUPERSEDES]->(root) WHERE n.status = 'active' })
    RETURN f.name AS fact, root.name AS root, length(p) AS hops,
           CASE WHEN root.status = 'retracted' THEN 'retracted' ELSE 'superseded' END AS reason,
           reduce(s = '', n IN nodes(p) |
                  s + CASE WHEN s = '' THEN '' ELSE ' -[:DERIVED_FROM]-> ' END + 'Fact/' + n.name)
             AS path
    ORDER BY fact, hops

- id: dangling-link
  severity: block
  title: Links to a note that does not exist
  message: "{source} -[:{type}]-> {target}, but there is no note `{target}.md`."
  fix: Add the missing note or remove the link.
  cypher: |
    MATCH (a)-[r]->(b)
    WHERE b.stub = true
    RETURN labels(a)[0] + '/' + a.name AS source, type(r) AS type,
           labels(b)[0] + '/' + b.name AS target
    ORDER BY source, type, target

- id: unsourced-fact
  severity: block
  title: Fact has no source
  message: "Fact/{fact} is active but has no `SOURCE` link, so nobody can verify it."
  fix: Link the file, commit, or document the agent read it from under `SOURCE`.
  cypher: |
    MATCH (f:Fact)
    WHERE f.status = 'active' AND NOT (f)-[:SOURCE]->()
    RETURN f.name AS fact
    ORDER BY fact

- id: unattributed-fact
  severity: warn
  title: Fact has no author
  message: "Fact/{fact} has no `ASSERTED_BY` link."
  fix: Link the agent that wrote the fact under `ASSERTED_BY`.
  cypher: |
    MATCH (f:Fact)
    WHERE NOT (f)-[:ASSERTED_BY]->()
    RETURN f.name AS fact
    ORDER BY fact

- id: orphan-fact
  severity: block
  title: Fact is not about anything
  message: >-
    Fact/{fact} is active but has no `ABOUT` link, so `recall` never returns it.
    The note can still name an entity in its file name.
  fix: >-
    Add an `ABOUT` link to `Entity/<name>` for the entity the fact describes.
  cypher: |
    MATCH (f:Fact)
    WHERE f.status = 'active'
      AND NOT (f)-[:ABOUT]->(:Entity)
      AND NOT EXISTS { MATCH (n:Fact)-[:SUPERSEDES]->(f) WHERE n.status = 'active' }
    RETURN f.name AS fact
    ORDER BY fact

- id: multi-hop-contradiction
  severity: block
  title: Contradicts a fact it was derived from
  message: >-
    Fact/{fact} says `{predicate}` is `{value}` for `{entity}`, but it was derived,
    {hops} step(s) away, from Fact/{root}, which says `{other_value}` for `{root_entity}`.
    The two notes are not about the same entity, so a side-by-side diff does not show a clash.
    Path: {path}
  fix: >-
    If the derived value is wrong, drop it or point `DERIVED_FROM` at the fact that states
    the value you actually used. If the old fact is wrong, supersede it and retract or
    replace the facts that were derived from it.
  cypher: |
    MATCH p = (f:Fact)-[:DERIVED_FROM*1..6]->(root:Fact)
    WHERE f.status = 'active' AND root.status = 'active'
      AND f.predicate = root.predicate AND f.value <> root.value
      AND NOT EXISTS { MATCH (n:Fact)-[:SUPERSEDES]->(f) WHERE n.status = 'active' }
      AND NOT EXISTS { MATCH (n:Fact)-[:SUPERSEDES]->(root) WHERE n.status = 'active' }
    OPTIONAL MATCH (f)-[:ABOUT]->(e:Entity)
    OPTIONAL MATCH (root)-[:ABOUT]->(re:Entity)
    RETURN f.name AS fact, root.name AS root, f.predicate AS predicate,
           f.value AS value, root.value AS other_value, length(p) AS hops,
           coalesce(e.name, '(no entity)') AS entity,
           coalesce(re.name, '(no entity)') AS root_entity,
           reduce(s = '', n IN nodes(p) |
                  s + CASE WHEN s = '' THEN '' ELSE ' -[:DERIVED_FROM]-> ' END + 'Fact/' + n.name)
             AS path
    ORDER BY fact, hops

- id: broken-provenance
  severity: block
  title: Evidence for this fact was retracted
  message: >-
    Fact/{fact} is current, but Source/{source} is retracted. The source is {hops}
    derivation step(s) from Fact/{root} (0 means this fact cites it directly). Path: {path}
  fix: >-
    Cite a source that is still current, or retract this fact and the facts derived from it.
  cypher: |
    MATCH p = (f:Fact)-[:DERIVED_FROM*0..6]->(root:Fact)-[:SOURCE]->(s:Source)
    WHERE f.status = 'active'
      AND NOT EXISTS { MATCH (n:Fact)-[:SUPERSEDES]->(f) WHERE n.status = 'active' }
      AND s.status = 'retracted'
      AND coalesce(s.stub, false) = false
    RETURN f.name AS fact, s.name AS source, root.name AS root, length(p) - 1 AS hops,
           reduce(acc = '', i IN range(0, size(nodes(p)) - 2) |
                  acc + CASE WHEN acc = '' THEN '' ELSE ' -[:DERIVED_FROM]-> ' END
                      + 'Fact/' + nodes(p)[i].name)
             + ' -[:SOURCE]-> Source/' + s.name AS path
    ORDER BY fact, hops, source
