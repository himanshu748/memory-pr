services:
  payments-api:
    build: .
    env_file: .env
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8080:8080"

  mongodb:
    image: mongo:8
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - mongodb-data:/data/db

volumes:
  mongodb-data:
